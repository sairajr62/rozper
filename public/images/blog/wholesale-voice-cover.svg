<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Rozper Blog — The Wholesale Voice Buyer's Guide">
  <defs>
    <!-- Surface gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>

    <!-- Aurora blooms (match the landing-page aurora language) -->
    <radialGradient id="auroraLeft" cx="0.15" cy="0.30" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraRight" cx="0.86" cy="0.74" r="0.55">
      <stop offset="0" stop-color="#046BD2" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#046BD2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraTop" cx="0.78" cy="0.20" r="0.45">
      <stop offset="0" stop-color="#0086F9" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#0086F9" stop-opacity="0"/>
    </radialGradient>

    <!-- Brand gradient for accent text -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#0086F9"/>
      <stop offset="1" stop-color="#046BD2"/>
    </linearGradient>

    <!-- Arc gradient -->
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#046BD2" stop-opacity="0.42"/>
    </linearGradient>

    <!-- Dot grid pattern with a soft radial mask -->
    <pattern id="grid" x="0" y="0" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="rgba(120,160,220,0.07)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMaskGrad" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="white" stop-opacity="1"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1600" height="900" fill="url(#gridMaskGrad)"/>
    </mask>

    <!-- Filters -->
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Layered backgrounds -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" mask="url(#gridMask)" opacity="0.6"/>
  <rect width="1600" height="900" fill="url(#auroraLeft)"/>
  <rect width="1600" height="900" fill="url(#auroraRight)"/>
  <rect width="1600" height="900" fill="url(#auroraTop)"/>

  <!-- Top hairline + brand label -->
  <g transform="translate(110, 110)">
    <line x1="0" y1="0" x2="36" y2="0" stroke="#0086F9" stroke-width="1.5"/>
    <text x="50" y="5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="rgba(255,255,255,0.66)" letter-spacing="3.4" font-weight="600">ROZPER  ·  BLOG</text>
  </g>

  <!-- Network graph (carrier interconnect motif) -->
  <g transform="translate(1050, 200)">
    <!-- Background bloom -->
    <circle cx="240" cy="220" r="270" fill="rgba(4,107,210,0.10)" filter="url(#softGlow)"/>

    <!-- Curved arcs -->
    <g fill="none" stroke="url(#arcGrad)" stroke-width="1.6" opacity="0.85" filter="url(#softGlow)">
      <path d="M 60 260 Q 180 120 360 200"/>
      <path d="M 60 260 Q 200 340 380 400"/>
      <path d="M 360 200 Q 440 280 500 220"/>
      <path d="M 380 400 Q 470 360 500 220"/>
      <path d="M 360 200 Q 380 340 380 400"/>
      <path d="M 250 300 Q 320 240 360 200"/>
      <path d="M 250 300 Q 320 360 380 400"/>
    </g>

    <!-- Faint long arcs -->
    <g fill="none" stroke="#0086F9" stroke-width="0.9" opacity="0.45" stroke-dasharray="2,5">
      <path d="M 60 260 Q 280 60 500 220"/>
      <path d="M 60 260 Q 280 540 500 220"/>
    </g>

    <!-- Outer rings -->
    <g fill="none" stroke-width="1">
      <circle cx="60" cy="260" r="22" stroke="#22D3EE" stroke-opacity="0.32"/>
      <circle cx="360" cy="200" r="26" stroke="#0086F9" stroke-opacity="0.34"/>
      <circle cx="500" cy="220" r="20" stroke="#22D3EE" stroke-opacity="0.30"/>
      <circle cx="380" cy="400" r="26" stroke="#046BD2" stroke-opacity="0.34"/>
    </g>

    <!-- Outer nodes -->
    <g filter="url(#nodeGlow)">
      <circle cx="60" cy="260" r="8" fill="#22D3EE"/>
      <circle cx="360" cy="200" r="11" fill="#0086F9"/>
      <circle cx="500" cy="220" r="7" fill="#22D3EE"/>
      <circle cx="380" cy="400" r="10" fill="#046BD2"/>
    </g>

    <!-- Central "Rozper" core -->
    <g transform="translate(250, 300)" filter="url(#nodeGlow)">
      <circle r="52" fill="rgba(34,211,238,0.08)" stroke="rgba(34,211,238,0.30)" stroke-width="1"/>
      <circle r="38" fill="rgba(0,134,249,0.14)" stroke="rgba(0,134,249,0.38)" stroke-width="1"/>
      <circle r="24" fill="url(#textGrad)"/>
      <circle r="12" fill="#0B1220"/>
      <circle r="5" fill="#22D3EE"/>
    </g>
  </g>

  <!-- Eyebrow -->
  <g transform="translate(110, 340)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#22D3EE" letter-spacing="6" font-weight="700">WHOLESALE  VOICE</text>
  </g>

  <!-- Headline (3 lines, last line gradient) -->
  <g transform="translate(110, 430)">
    <text font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="76" font-weight="700" letter-spacing="-2.4" fill="#FFFFFF">
      <tspan x="0" dy="0">When the network</tspan>
      <tspan x="0" dy="86">matters more than</tspan>
      <tspan x="0" dy="86" fill="url(#textGrad)">the rate sheet.</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(110, 780)">
    <text font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" fill="rgba(204,214,223,0.78)" font-weight="400">
      <tspan x="0" dy="0">The wholesale voice buyer's guide — why 99.999% uptime is a revenue decision.</tspan>
    </text>
  </g>

  <!-- Bottom-right trust chip -->
  <g transform="translate(1190, 800)">
    <rect x="0" y="-26" width="300" height="38" rx="19" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <circle cx="22" cy="-7" r="4" fill="#22D3EE"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="40" y="-3" font-size="11" fill="rgba(255,255,255,0.78)" letter-spacing="2.2" font-weight="600">99.999%  ·  150+ COUNTRIES</text>
  </g>
</svg>
